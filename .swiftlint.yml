# SwiftLint Configuration for SendspinKit

excluded:
  - .build
  # Each example SPM package has its own .build/ dir containing checked-out
  # dependency sources (Starscream, swift-argument-parser). Lint our code,
  # not theirs. SwiftLint's glob matching requires the explicit wildcard.
  - Examples/*/.build

# Disabled rules
# File and type length are weak complexity proxies that encouraged arbitrary
# extension-file splits and conflict with SwiftFormat's multiline wrapping.
disabled_rules:
  - todo
  - file_length
  - type_body_length

# Opt-in rules
opt_in_rules:
  - trailing_comma

# Keep local complexity bounded even though aggregate file/type size is unrestricted.
function_body_length:
  warning: 100
  error: 150

# Cyclomatic complexity - adjusted for real-world protocol handling
cyclomatic_complexity:
  warning: 30
  error: 40

# Line length
line_length:
  warning: 150
  error: 200
  ignores_comments: true
  ignores_urls: true

# Identifier names
identifier_name:
  min_length:
    warning: 3
    error: 2
  excluded:
    - id
    - to
    - db
    - i   # loop counter
    - t   # time variable in tests
    - v   # value in decode/encode
    - p   # payload destructuring
    - b0  # byte unpacking
    - b1
    - b2
    - fs  # frameSize (audio callback hot path)
    - sr  # sampleRate (audio callback hot path)
    - dt  # delta time (Kalman filter)
    - ts  # timespec (MonotonicClock)
    - cb  # callback (audio hot path)
    - rc  # return code (POSIX convention)
    - v1  # version identifiers in tests
    - v2
    - a   # test fixtures (equality/hashing tests)
    - b
    - c
  validates_start_with_lowercase: warning

# Trailing commas - never allow them (matches SwiftFormat config)
trailing_comma:
  mandatory_comma: false

# Large tuple
large_tuple:
  warning: 4
  error: 5

# Force casts are acceptable in test assertions (JSON parsing, etc.)
force_cast:
  severity: warning

# Custom rules
custom_rules:
  # Backtick-quoted function names with spaces require Swift 6.2+.
  # CI runs Swift 6.1, so these will fail to parse there.
  # Remove this rule when the CI toolchain is bumped to 6.2+.
  no_backtick_space_func_names:
    name: "No backtick function names with spaces"
    regex: 'func\s+`[^`]*\s[^`]*`\s*\('
    message: "Backtick function names with spaces require Swift 6.2+. Use camelCase identifiers instead."
    severity: error
