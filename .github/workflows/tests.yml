name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install swiftformat swiftlint

      - name: SwiftFormat (lint mode)
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint lint --strict

  examples:
    name: Examples
    runs-on: macos-26

    # The test job cannot see these — separate packages. See AGENTS.md.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build all examples
        run: ./scripts/build-examples.sh

  release-build:
    name: Release build
    runs-on: macos-26
    timeout-minutes: 15

    # `swift test` only compiles the debug configuration, so a symbol that exists
    # inside `#if DEBUG` but is used outside it ships green; only a release build catches it.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build release configuration
        run: swift build -c release -Xswiftc -warnings-as-errors

  test:
    name: Test
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run all tests with coverage
        timeout-minutes: 8
        env:
          NSUnbufferedIO: "YES"
        # Warnings-as-errors keeps the package warning-free for downstream Xcode
        # consumers, which surface path-dependency warnings local build logs filter
        # out. Toolchain bumps that add new warnings must fail here.
        #
        # The suite runs to a log under a stall watchdog: if no test output lands for
        # 60 s, the step names the tests still in flight, stack-samples the testing
        # helper, and fails, so a wedged run leaves a diagnosis instead of a timeout.
        run: |
          set -o pipefail
          swift test --enable-code-coverage -Xswiftc -warnings-as-errors > test-output.log 2>&1 &
          suite=$!
          quiet=0; last=-1
          while kill -0 "$suite" 2>/dev/null; do
            sleep 5
            size=$(stat -f %z test-output.log 2>/dev/null || echo 0)
            if [ "$size" = "$last" ]; then quiet=$((quiet + 5)); else quiet=0; last=$size; fi
            if [ "$quiet" -ge 60 ] && grep -q '◇ Test ' test-output.log; then
              echo "::error::No test output for ${quiet}s; the run is wedged."
              grep -E '◇ Test .* started' test-output.log | sed -E 's/^◇ Test (.*) started\.$/\1/' | sort -u > started.txt
              { grep -E '✔ Test .* passed after' test-output.log | sed -E 's/^✔ Test (.*) passed after.*/\1/'
                grep -E '✘ Test .* failed after' test-output.log | sed -E 's/^✘ Test (.*) failed after.*/\1/'
                grep -E '➜ Test .* skipped' test-output.log | sed -E 's/^➜ Test (.*) skipped.*/\1/'; } | sort -u > finished.txt
              echo "Tests still in flight:"; comm -23 started.txt finished.txt
              helper=$(pgrep -f swiftpm-testing-helper | head -1)
              ps -o pid,ppid,stat,wchan,command -p "$suite" ${helper:+-p "$helper"} || true
              if [ -n "$helper" ]; then sample "$helper" 10 -file hang.sample; echo "Helper stack written to hang.sample"; fi
              # The parent pumps the helper's output; if it stops draining, the helper blocks on write().
              sample "$suite" 10 -file hang-parent.sample || true
              pump=$(pgrep -fn 'swift-test' | head -1)
              if [ -n "$pump" ] && [ "$pump" != "$suite" ]; then sample "$pump" 10 -file hang-pump.sample || true; fi
              pkill -9 -f swiftpm-testing-helper || true
              kill -9 "$suite" || true
              cat test-output.log
              exit 1
            fi
          done
          # `|| rc=$?` keeps errexit from skipping the log print when the suite fails.
          rc=0; wait "$suite" || rc=$?
          cat test-output.log
          exit $rc

      - name: Upload hang diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hang-diagnosis
          path: |
            hang.sample
            hang-parent.sample
            hang-pump.sample
            test-output.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Locate test binary and profdata
        id: artifacts
        run: |
          BIN=$(find .build -path "*/SendspinKitPackageTests.xctest/Contents/MacOS/SendspinKitPackageTests" -type f | head -1)
          if [ -z "$BIN" ]; then
            echo "::error::Could not find SendspinKitPackageTests binary"
            find .build -name "SendspinKitPackageTests" -type f
            exit 1
          fi
          PROFDATA=$(find .build -name "default.profdata" -type f | head -1)
          if [ -z "$PROFDATA" ]; then
            echo "::error::Could not find default.profdata"
            exit 1
          fi
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          echo "profdata=$PROFDATA" >> "$GITHUB_OUTPUT"

      - name: Generate LCOV report
        run: |
          xcrun llvm-cov export \
            -format="lcov" \
            "${{ steps.artifacts.outputs.bin }}" \
            -instr-profile "${{ steps.artifacts.outputs.profdata }}" \
            > coverage.lcov

      - name: Generate coverage summary
        id: coverage
        run: |
          # JSON summary is mechanically parseable — no awk on llvm-cov's
          # text table format, which varies across toolchain versions.
          xcrun llvm-cov export \
            -format="text" \
            -summary-only \
            "${{ steps.artifacts.outputs.bin }}" \
            -instr-profile "${{ steps.artifacts.outputs.profdata }}" \
            > coverage-summary.json

          LINE_PCT=$(python3 -c "import json; print(round(json.load(open('coverage-summary.json'))['data'][0]['totals']['lines']['percent'], 2))")
          FUNC_PCT=$(python3 -c "import json; print(round(json.load(open('coverage-summary.json'))['data'][0]['totals']['functions']['percent'], 2))")
          echo "line_coverage=$LINE_PCT" >> "$GITHUB_OUTPUT"
          echo "func_coverage=$FUNC_PCT" >> "$GITHUB_OUTPUT"

          # Also generate the human-readable table for the step summary
          xcrun llvm-cov report \
            "${{ steps.artifacts.outputs.bin }}" \
            -instr-profile "${{ steps.artifacts.outputs.profdata }}" \
            > coverage-report.txt

          echo "### Test Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Line Coverage: ${LINE_PCT}% · Function Coverage: ${FUNC_PCT}%**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Check coverage threshold
        run: |
          LINE_PCT="${{ steps.coverage.outputs.line_coverage }}"
          THRESHOLD=40

          if python3 -c "exit(0 if float('$LINE_PCT') >= $THRESHOLD else 1)"; then
            echo "Line coverage ${LINE_PCT}% meets threshold ${THRESHOLD}%"
          else
            echo "::error::Line coverage ${LINE_PCT}% is below threshold ${THRESHOLD}%"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.lcov
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const linePct = '${{ steps.coverage.outputs.line_coverage }}';
            const funcPct = '${{ steps.coverage.outputs.func_coverage }}';
            const report = fs.readFileSync('coverage-report.txt', 'utf8');

            const body = [
              `## Test Coverage Report`,
              ``,
              `**Line Coverage: ${linePct}% · Function Coverage: ${funcPct}%**`,
              ``,
              `<details>`,
              `<summary>Detailed Coverage Report</summary>`,
              ``,
              '```',
              report.trim(),
              '```',
              ``,
              `</details>`,
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.lcov
            coverage-report.txt
            coverage-summary.json
          retention-days: 30
